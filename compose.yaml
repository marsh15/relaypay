name: relaypay

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  RELAYPAY_DATABASE_URL: postgresql+psycopg://relaypay_app:${RELAYPAY_APP_DB_PASSWORD:-relaypay_app_dev}@postgres:5432/relaypay
  RELAYPAY_MIGRATION_DATABASE_URL: postgresql+psycopg://relaypay_migrator:${RELAYPAY_MIGRATOR_DB_PASSWORD:-relaypay_migrator_dev}@postgres:5432/relaypay
  PROVIDER_DATABASE_URL: postgresql+psycopg://provider_app:${PROVIDER_APP_DB_PASSWORD:-provider_app_dev}@postgres:5432/provider
  PROVIDER_MIGRATION_DATABASE_URL: postgresql+psycopg://provider_migrator:${PROVIDER_MIGRATOR_DB_PASSWORD:-provider_migrator_dev}@postgres:5432/provider
  BANK_DATABASE_URL: postgresql+psycopg://bank_app:${BANK_APP_DB_PASSWORD:-bank_app_dev}@postgres:5432/bank
  BANK_MIGRATION_DATABASE_URL: postgresql+psycopg://bank_migrator:${BANK_MIGRATOR_DB_PASSWORD:-bank_migrator_dev}@postgres:5432/bank
  COMMERCE_DATABASE_URL: postgresql+psycopg://commerce_app:${COMMERCE_APP_DB_PASSWORD:-commerce_app_dev}@postgres:5432/commerce
  COMMERCE_MIGRATION_DATABASE_URL: postgresql+psycopg://commerce_migrator:${COMMERCE_MIGRATOR_DB_PASSWORD:-commerce_migrator_dev}@postgres:5432/commerce
  RECEIVER_DATABASE_URL: postgresql+psycopg://receiver_app:${RECEIVER_APP_DB_PASSWORD:-receiver_app_dev}@postgres:5432/relaypay
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  REDPANDA_BROKERS: redpanda:9092
  SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me-32-bytes}
  CSRF_SECRET: ${CSRF_SECRET:-dev-csrf-secret-change-me-32-bytes}
  API_KEY_PEPPER: ${API_KEY_PEPPER:-dev-api-key-pepper-change-me-32-bytes}
  IDEMPOTENCY_KEY_PEPPER: ${IDEMPOTENCY_KEY_PEPPER:-dev-idempotency-pepper-change-me}
  WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:-dev-only-generate-a-fernet-key}
  PROVIDER_BASE_URL: http://provider:8001
  PROVIDER_ACCOUNT_ID: ${PROVIDER_ACCOUNT_ID:-acct_relaypay_demo}
  PROVIDER_SIGNING_SECRET: ${PROVIDER_SIGNING_SECRET:-dev-provider-signing-secret-change-me}
  PROVIDER_CONTROL_SECRET: ${PROVIDER_CONTROL_SECRET:-dev-provider-control-secret-change-me}
  BANK_BASE_URL: http://bank:8003
  BANK_ACCOUNT_ID: ${BANK_ACCOUNT_ID:-bank_relaypay_demo}
  BANK_SIGNING_SECRET: ${BANK_SIGNING_SECRET:-dev-bank-signing-secret-change-me}
  BANK_CONTROL_SECRET: ${BANK_CONTROL_SECRET:-dev-bank-control-secret-change-me}
  COMMERCE_BASE_URL: http://commerce:8004
  COMMERCE_ACCOUNT_ID: ${COMMERCE_ACCOUNT_ID:-commerce_relaypay_demo}
  COMMERCE_CONTROL_SECRET: ${COMMERCE_CONTROL_SECRET:-dev-commerce-control-secret-change-me}
  CONNECTOR_CREDENTIAL_ENCRYPTION_KEY: ${CONNECTOR_CREDENTIAL_ENCRYPTION_KEY:-dev-connector-credential-encryption-key}
  RECEIVER_BASE_URL: http://receiver:8002
  RECEIVER_WEBHOOK_SECRET: ${RECEIVER_WEBHOOK_SECRET:-dev-receiver-secret-change-me}
  OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

x-service-defaults: &service-defaults
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M

services:
  postgres:
    <<: *service-defaults
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_only}
      POSTGRES_DB: postgres
      RELAYPAY_MIGRATOR_DB_PASSWORD: ${RELAYPAY_MIGRATOR_DB_PASSWORD:-relaypay_migrator_dev}
      RELAYPAY_APP_DB_PASSWORD: ${RELAYPAY_APP_DB_PASSWORD:-relaypay_app_dev}
      PROVIDER_MIGRATOR_DB_PASSWORD: ${PROVIDER_MIGRATOR_DB_PASSWORD:-provider_migrator_dev}
      PROVIDER_APP_DB_PASSWORD: ${PROVIDER_APP_DB_PASSWORD:-provider_app_dev}
      BANK_MIGRATOR_DB_PASSWORD: ${BANK_MIGRATOR_DB_PASSWORD:-bank_migrator_dev}
      BANK_APP_DB_PASSWORD: ${BANK_APP_DB_PASSWORD:-bank_app_dev}
      COMMERCE_MIGRATOR_DB_PASSWORD: ${COMMERCE_MIGRATOR_DB_PASSWORD:-commerce_migrator_dev}
      COMMERCE_APP_DB_PASSWORD: ${COMMERCE_APP_DB_PASSWORD:-commerce_app_dev}
      RECEIVER_APP_DB_PASSWORD: ${RECEIVER_APP_DB_PASSWORD:-receiver_app_dev}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    <<: *service-defaults
    image: redis:8.2.0-bookworm
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  redpanda:
    <<: *service-defaults
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: "no"
    environment: *app-environment
    command:
      - sh
      - -ec
      - |
        alembic -c migrations/relaypay/alembic.ini upgrade head
        alembic -c migrations/provider/alembic.ini upgrade head
        alembic -c migrations/bank/alembic.ini upgrade head
        alembic -c migrations/commerce/alembic.ini upgrade head
        alembic -c migrations/receiver/alembic.ini upgrade head
        python -m scripts.seed
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["uvicorn", "apps.api.asgi:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment: *app-environment
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      provider:
        condition: service_healthy
      bank:
        condition: service_healthy
      commerce:
        condition: service_healthy
      receiver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  provider:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["uvicorn", "apps.provider.asgi:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    environment: *app-environment
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live')"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  receiver:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["uvicorn", "apps.receiver.asgi:app", "--host", "0.0.0.0", "--port", "8002", "--no-access-log"]
    environment: *app-environment
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/ready')"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  bank:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["uvicorn", "apps.bank.asgi:app", "--host", "0.0.0.0", "--port", "8003", "--no-access-log"]
    environment: *app-environment
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health/live')"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  commerce:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["uvicorn", "apps.commerce.asgi:app", "--host", "0.0.0.0", "--port", "8004", "--no-access-log"]
    environment: *app-environment
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health/live')"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  poller:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["python", "-m", "apps.worker.poller"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      provider:
        condition: service_healthy
      bank:
        condition: service_healthy
      commerce:
        condition: service_healthy
      receiver:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  worker:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.python
    command:
      ["celery", "-A", "apps.worker.celery_app:app", "worker", "--beat", "--pool=solo", "--loglevel=INFO"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      provider:
        condition: service_healthy
      bank:
        condition: service_healthy
      receiver:
        condition: service_healthy

  console:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.console
    environment:
      INTERNAL_API_BASE_URL: http://api:8000
    ports:
      - "${CONSOLE_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  caddy:
    <<: *service-defaults
    image: caddy:2.10.2-alpine
    profiles: ["edge"]
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-admin@example.test}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      console:
        condition: service_started

  otel-collector:
    <<: *service-defaults
    image: otel/opentelemetry-collector-contrib:0.157.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v3.12.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./infra/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    <<: *service-defaults
    image: grafana/grafana:13.1.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
