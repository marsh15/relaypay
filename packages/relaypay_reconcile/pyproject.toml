[project]
name = "relaypay-reconcile"
version = "0.1.0"
description = "Stdlib-only seller reconciliation of settlement exports against order exports"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.scripts]
relaypay-reconcile = "relaypay_reconcile.cli:main"

[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relaypay_reconcile"]
