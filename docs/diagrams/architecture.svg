<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1030" width="1500" height="1030" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>RelayPay system architecture</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect width="1500" height="1030" fill="#ffffff"/>
<text x="20" y="36.0" font-size="22" font-weight="700" fill="#1e1e1e" xml:space="preserve">RelayPay system architecture (v1.0.1, Docker Compose topology)</text>
<rect x="20" y="60" width="250" height="590" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1"/>
<text x="34" y="85.0" font-size="15" font-weight="700" fill="#495057" xml:space="preserve">Clients</text>
<rect x="40" y="100" width="210" height="78" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text x="52" y="125.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">Operator browser</text>
<text x="52" y="146.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">Console UI, session cookie</text>
<rect x="40" y="250" width="210" height="104" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text x="52" y="275.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">Merchant server / SDK</text>
<text x="52" y="296.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">Authorization: Bearer rpk_...</text>
<text x="52" y="312.6" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">Idempotency-Key header</text>
<text x="52" y="329.3" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">dev: API :8000; prod: via Caddy</text>
<rect x="40" y="460" width="210" height="108" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2" stroke-dasharray="8 6"/>
<text x="52" y="485.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">Cloudflare Worker</text>
<text x="52" y="506.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">Optional; not deployed here</text>
<text x="52" y="522.6" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">Durable Object: rate + replay</text>
<text x="52" y="539.3" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">R2 archive, Queue (webhooks)</text>
<text x="52" y="555.9" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">HMAC-signs origin requests</text>
<rect x="300" y="60" width="580" height="82" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/>
<text x="312" y="85.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">Caddy 2.10 (compose profile 'edge')</text>
<text x="312" y="106.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">TLS + HTTP/3. /api/*, /health/* -&gt; api. /webhooks/relaypay -&gt; receiver.</text>
<text x="312" y="122.6" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">Everything else -&gt; console. Provider control routes are not exposed.</text>
<rect x="300" y="162" width="600" height="488" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1"/>
<text x="314" y="187.0" font-size="15" font-weight="700" fill="#495057" xml:space="preserve">Application tier</text>
<rect x="320" y="204" width="270" height="100" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text x="332" y="229.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">Next.js console :3000</text>
<text x="332" y="250.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">Server components fetch the API;</text>
<text x="332" y="266.6" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">client calls use the /backend/* proxy</text>
<text x="332" y="283.3" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">(GET/POST, cookie + X-CSRF-Token)</text>
<rect x="320" y="330" width="560" height="142" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2"/>
<text x="332" y="355.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">RelayPay API (FastAPI) :8000</text>
<text x="332" y="376.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">/api/v1  merchant API: API-key scopes,</text>
<text x="332" y="392.6" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">   route-aware idempotency, cursors</text>
<text x="332" y="409.3" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">/api/admin/v1, /api/session: session</text>
<text x="332" y="425.9" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">   cookie + CSRF + membership roles</text>
<text x="332" y="442.6" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">/api/inbound/v1  HMAC-signed events</text>
<text x="332" y="459.2" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">/health/*, /metrics (opt-in)</text>
<text x="612" y="376.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">Mutating commands:</text>
<text x="612" y="392.6" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">1 commit SENT attempt (no HTTP yet)</text>
<text x="612" y="409.3" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">2 HTTP to counterparty, after commit</text>
<text x="612" y="425.9" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">3 lookup-only recovery if ambiguous</text>
<text x="612" y="442.6" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">4 shared finalizer, one transaction:</text>
<text x="612" y="459.2" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">   journal + event + every idem. key</text>
<rect x="320" y="492" width="400" height="144" rx="10" fill="#e6fcf5" stroke="#099268" stroke-width="2"/>
<text x="332" y="517.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">Poller (single scheduler)</text>
<text x="332" y="538.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">1s: provider recovery, webhook materialize</text>
<text x="332" y="554.6" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">  + deliver, reconciliation, payouts,</text>
<text x="332" y="571.3" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">  subscription recovery</text>
<text x="332" y="587.9" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">2s: inbound webhooks. 1h: settlement forecasts</text>
<text x="332" y="604.6" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">Each tick: drain &lt;=100 outbox rows</text>
<text x="332" y="621.2" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">Claims: SKIP LOCKED + lease tokens</text>
<rect x="940" y="162" width="540" height="488" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1"/>
<text x="954" y="187.0" font-size="15" font-weight="700" fill="#495057" xml:space="preserve">Synthetic counterparties (separate containers)</text>
<rect x="960" y="204" width="240" height="72" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text x="972" y="229.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">Mock provider :8001</text>
<text x="972" y="250.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">authorize/capture/refund, faults</text>
<rect x="1220" y="204" width="240" height="72" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text x="1232" y="229.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">Mock bank :8003</text>
<text x="1232" y="250.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">payout transfers, faults</text>
<rect x="960" y="292" width="240" height="72" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text x="972" y="317.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">Mock commerce :8004</text>
<text x="972" y="338.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">orders, payment links</text>
<rect x="1220" y="292" width="240" height="72" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text x="1232" y="317.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">Dispute network :8005</text>
<text x="1232" y="338.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">in-memory submissions</text>
<rect x="960" y="380" width="240" height="72" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text x="972" y="405.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">Recovery network :8006</text>
<text x="972" y="426.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">messages, payment retries</text>
<rect x="1220" y="380" width="240" height="72" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text x="1232" y="405.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">Merchant site :8007</text>
<text x="1232" y="426.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">static risk-review snapshots</text>
<rect x="960" y="468" width="240" height="72" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text x="972" y="493.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">Webhook receiver :8002</text>
<text x="972" y="514.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">HMAC check, dedupe by id + digest</text>
<text x="1220" y="482.0" font-size="12" font-weight="400" fill="#495057" xml:space="preserve">Provider and bank responses are</text>
<text x="1220" y="497.4" font-size="12" font-weight="400" fill="#495057" xml:space="preserve">HMAC-signed and verified by</text>
<text x="1220" y="512.7" font-size="12" font-weight="400" fill="#495057" xml:space="preserve">RelayPay before use.</text>
<text x="962" y="592.0" font-size="12" font-weight="400" fill="#495057" xml:space="preserve">Solid arrows: runtime HTTP / SQL / publish. Dashed orange: optional Cloudflare</text>
<text x="962" y="607.4" font-size="12" font-weight="400" fill="#495057" xml:space="preserve">path (source and local proof only; this repo does not deploy it).</text>
<text x="962" y="622.7" font-size="12" font-weight="400" fill="#495057" xml:space="preserve">Both API and poller call counterparties; a call is committed as SENT first.</text>
<rect x="300" y="680" width="1180" height="172" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1"/>
<text x="314" y="705.0" font-size="15" font-weight="700" fill="#495057" xml:space="preserve">PostgreSQL 17 (one server)</text>
<rect x="320" y="722" width="560" height="112" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/>
<text x="332" y="747.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">relaypay database</text>
<text x="332" y="768.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">organisations, memberships, API keys, ledger, provider operations,</text>
<text x="332" y="784.6" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">idempotency, events, deliveries, reconciliation, balances, payouts,</text>
<text x="332" y="801.3" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">connectors, disputes, recovery, settlement, risk review, agent runtime</text>
<text x="332" y="817.9" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">+ isolated schema 'receiver' (received_events)</text>
<rect x="895" y="722" width="155" height="112" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/>
<text x="907" y="747.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">provider</text>
<text x="907" y="768.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">effects, faults,</text>
<text x="907" y="784.6" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">statement exports</text>
<rect x="1062" y="722" width="155" height="112" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/>
<text x="1074" y="747.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">bank</text>
<text x="1074" y="768.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">accounts, transfers,</text>
<text x="1074" y="784.6" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">faults</text>
<rect x="1229" y="722" width="231" height="112" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/>
<text x="1241" y="747.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">commerce</text>
<text x="1241" y="768.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">accounts, orders,</text>
<text x="1241" y="784.6" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">payment links</text>
<rect x="20" y="680" width="250" height="172" rx="10" fill="#fff0f6" stroke="#c2255c" stroke-width="2"/>
<text x="32" y="705.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">Redpanda (Kafka API)</text>
<text x="32" y="726.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">Outbox publish target:</text>
<text x="32" y="742.6" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">topic relaypay.&lt;event&gt;.v1</text>
<text x="32" y="759.3" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">At-least-once, derived stream.</text>
<text x="32" y="775.9" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">No consumer in this repo;</text>
<text x="32" y="792.6" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">PostgreSQL stays authoritative.</text>
<rect x="300" y="872" width="1180" height="140" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1"/>
<text x="314" y="897.0" font-size="15" font-weight="700" fill="#495057" xml:space="preserve">Observability (compose profile 'observability', off by default)</text>
<rect x="320" y="912" width="330" height="80" rx="10" fill="#ffffff" stroke="#868e96" stroke-width="2"/>
<text x="332" y="937.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">OpenTelemetry Collector :4318</text>
<text x="332" y="958.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">traces -&gt; debug exporter only</text>
<rect x="670" y="912" width="330" height="80" rx="10" fill="#ffffff" stroke="#868e96" stroke-width="2"/>
<text x="682" y="937.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">Prometheus :9090</text>
<text x="682" y="958.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">scrapes api, provider, receiver, bank,</text>
<text x="682" y="974.6" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">commerce (poller target is misnamed)</text>
<rect x="1020" y="912" width="440" height="80" rx="10" fill="#ffffff" stroke="#868e96" stroke-width="2"/>
<text x="1032" y="937.0" font-size="16" font-weight="700" fill="#1e1e1e" xml:space="preserve">Grafana :3001</text>
<text x="1032" y="958.0" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">provisioned 'RelayPay Operations Evidence'</text>
<text x="1032" y="974.6" font-size="13" font-weight="400" fill="#343a40" xml:space="preserve">dashboard, anonymous viewer</text>
<polyline points="250,139 275,139 275,101 300,101" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="250,330 320,350" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="145,354 145,460" fill="none" stroke="#e8590c" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ao)"/>
<text x="152" y="411.0" font-size="11" font-weight="400" fill="#e8590c" xml:space="preserve">optional</text>
<polyline points="250,514 285,514 285,445 320,445" fill="none" stroke="#e8590c" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ao)"/>
<polyline points="455,142 455,204" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="461" y="183.0" font-size="11" font-weight="400" fill="#495057" xml:space="preserve">/*</text>
<polyline points="800,142 800,330" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="806" y="183.0" font-size="11" font-weight="400" fill="#495057" xml:space="preserve">/api/*, /health/*</text>
<polyline points="455,304 455,330" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="860,472 860,722" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="580,636 580,722" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="586" y="665.0" font-size="11" font-weight="400" fill="#495057" xml:space="preserve">claims, finalize, outbox rows</text>
<polyline points="880,400 940,400" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="886" y="383.0" font-size="11" font-weight="400" fill="#495057" xml:space="preserve">mutate,</text>
<text x="886" y="396.0" font-size="11" font-weight="400" fill="#495057" xml:space="preserve">submit</text>
<polyline points="720,570 940,570" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="726" y="563.0" font-size="11" font-weight="400" fill="#495057" xml:space="preserve">lookups, deliveries</text>
<polyline points="1210,650 1210,680" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="1228" y="669.0" font-size="11" font-weight="400" fill="#495057" xml:space="preserve">each service owns its database</text>
<polyline points="320,600 145,600 145,680" fill="none" stroke="#1e1e1e" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="170" y="593.0" font-size="11" font-weight="400" fill="#495057" xml:space="preserve">outbox publish</text>
</svg>
